name: 问题反馈
description: 报告一个可以复现的客户端问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 工具箱版本
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options: [Windows, macOS]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿粘贴账号、密钥、Cookie、客户数据或完整诊断文件。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
