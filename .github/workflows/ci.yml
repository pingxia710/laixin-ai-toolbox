name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 网络集成用例会启动真实子进程并争用同一组本机端口；CI 串行跑文件，避免用例之间互相冒充客户环境冲突。
      - run: npm test -- --fileParallelism=false
