name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prepare:xray
      # 这三组用例依赖全局端口与真实子进程，先在干净现场单独跑，避免前序故障演练留下的系统级状态干扰判据。
      - name: Run clean-state network lifecycle tests
        run: npx --no-install vitest run tests/tunnel/ipc-actions.test.ts tests/tunnel/self-repair.test.ts tests/tunnel/self-repair-timeout.test.ts
      - name: Run remaining tests
        run: npx --no-install vitest run --exclude tests/tunnel/ipc-actions.test.ts --exclude tests/tunnel/self-repair.test.ts --exclude tests/tunnel/self-repair-timeout.test.ts
